plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bridge.mx'
    compileSdk 34

    defaultConfig {
        applicationId "com.bridge.mx"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pre-install test suite (pure JVM: parser, matcher, planner)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
